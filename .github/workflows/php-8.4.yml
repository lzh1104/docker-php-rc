## https://github.com/docker/build-push-action


name: php 8.4 fpm

## 手动调度
on: workflow_dispatch

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      -
        name: Login to cr.console.aliyun.com
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_ALIYUN_USERNAME }}
          password: ${{ secrets.DOCKER_ALIYUN_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          build-args: |
            SWOOLE_VERSION=5.1.1
          context: .
          file: Dockerfile.8.4-fpm
          push: true
          # 阿里云 ACR 个人版（registry.cn-*.aliyuncs.com）不支持 OCI 1.1 artifact。
          # 新版 BuildKit 默认生成 provenance/SBOM attestation，其 config 使用
          # application/vnd.oci.empty.v1+json，个人版会直接拒绝：
          #   denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # 三项全部关闭：不生成 attestation，并强制用 Docker schema2 media type。
          provenance: false
          sbom: false
          oci-mediatypes: false
          tags: |
            lzh1104/php-rc:8.4-fpm
            registry.cn-hangzhou.aliyuncs.com/lzh1104/php-rc:8.4-fpm
